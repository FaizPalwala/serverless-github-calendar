name: Test Heatmap Action
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Run Action Locally
        uses: ./packages/serverless-github-calendar-action
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: FaizPalwala
          output-file: public/contributions.json
          output-svg: public/heatmap.svg
          
      - name: Validate Output
        run: |
          if [ ! -f "public/contributions.json" ]; then
            echo "::error::contributions.json was not created"
            exit 1
          fi
          if [ ! -f "public/heatmap.svg" ]; then
            echo "::error::heatmap.svg was not created"
            exit 1
          fi
          
          # Ensure JSON is valid and contains 'weeks' array
          node -e "
            const data = require('./public/contributions.json');
            if (!data.user.contributionsCollection.contributionCalendar.weeks) {
              console.error('Invalid JSON structure');
              process.exit(1);
            }
            console.log('JSON Output is valid and contains streak data!');
          "

